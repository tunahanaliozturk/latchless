[package]
name = "latchless"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Lock-free queues and stacks with their own epoch-based reclamation, model-checked with loom"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tunahanaliozturk/latchless"
readme = "README.md"
keywords = ["lock-free", "concurrency", "queue", "atomic", "no_std"]
categories = ["concurrency", "data-structures", "no-std"]
exclude = ["/.github", "/docs"]

# loom is only built when the crate is compiled with `--cfg loom`, and only for
# the crate's own unit tests. The shipped crate has no dependencies.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7.3"

[lints.rust]
# This crate needs unsafe. The rules for it are in docs/adr/0001.
unsafe_op_in_unsafe_fn = "deny"
# `loom` switches the atomics to loom's; `latchless_mutation` builds a known-wrong
# variant on purpose (docs/adr/0003).
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(loom)",
  'cfg(latchless_mutation, values("spsc_relaxed_publish"))',
] }
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
expect_used = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
cast_possible_truncation = "warn"
cast_lossless = "warn"
dbg_macro = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
unwrap_used = "warn"
